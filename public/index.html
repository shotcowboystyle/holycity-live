<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy City Live</title>
<meta name="description" content="Live flood, heat, construction, public safety and city-service dashboards for Charleston, SC, built on public NOAA, USGS, FEMA, City and County data.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#141A22">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Holy City Live">
<meta property="og:title" content="Holy City Live">
<meta property="og:description" content="Live flood, heat, construction, public safety and city-service dashboards for Charleston, SC.">
<link rel="canonical" href="https://www.holycity.live/">
<meta property="og:url" content="https://www.holycity.live/">
<meta property="og:image" content="https://www.holycity.live/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Holy City Live, Charleston, S.C.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="tokens.css">
<script src="theme.js"></script>
<script src="/ga.js"></script><!-- Google Analytics; empty unless GA_MEASUREMENT_ID is set on the Worker -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
  body { display: flex; flex-direction: column; }
  nav { display: flex; align-items: stretch; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    overflow-x: auto; flex: 0 0 auto; }
  nav .logo { align-self: center; display: flex; margin-right: 14px; flex: 0 0 auto; }
  nav .logo img { display: block; height: 26px; width: auto; }
  [data-theme=light] .logo .on-dark, [data-theme=dark] .logo .on-light { display: none; }
  nav .logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  nav button, nav a[role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 11px 12px 9px;
    font: inherit; cursor: pointer; white-space: nowrap; text-decoration: none; }
  nav button:hover, nav a[role=tab]:hover { color: var(--text); }
  nav [role=tab][aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
  nav button:focus-visible, nav a[role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav [role=tablist] { display: flex; gap: 2px; }
  nav #theme { margin-left: auto; }
  @media (max-width: 760px) { nav button, nav a[role=tab] { min-height: 44px; box-sizing: border-box; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  main { position: relative; flex: 1; }
  /* inactive tabs stay laid out (visibility, not display) so maps keep their size and state */
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
  iframe.active { visibility: visible; }
</style>
</head>
<body>
<h1 class="sr-only">Holy City Live: live flood, heat, construction, public safety and service-day dashboards for Charleston, SC</h1>
<nav>
  <a href="/" class="logo">
    <img class="on-dark" src="logo-reverse.svg" alt="Holy City Live" width="151" height="26">
    <img class="on-light" src="logo-color.svg" alt="Holy City Live" width="151" height="26">
  </a>
  <div role="tablist" aria-label="Dashboards">
    <a role="tab" data-tab="risk" href="/risk">Flood &amp; Heat Risk</a>
    <a role="tab" data-tab="construction" href="/construction">Construction Near Me</a>
    <a role="tab" data-tab="safety" href="/safety">Public Safety Trends</a>
    <a role="tab" data-tab="services" href="/services">Service Days</a>
  </div>
  <button id="theme" type="button"></button>
  <button id="share" type="button" title="Copy a link to this tab, address and settings">Copy link</button>
</nav>
<main id="panes"></main>
<script>
  // Each dashboard is its own page, loaded into an iframe the first time its tab opens and kept alive after.
  const tabs = [...document.querySelectorAll('[role=tab]')], panes = document.getElementById('panes'), frames = {};
  function show(name) {
    const tab = tabs.find(t => t.dataset.tab === name) ?? tabs[0];
    if (tab.getAttribute('aria-selected') !== 'true') // one page_view per tab opened; the hash only, never the address/settings in the URL
      window.gtag?.('event', 'page_view', { page_title: tab.textContent, page_location: location.origin + '/#' + tab.dataset.tab });
    if (!frames[tab.dataset.tab]) {
      const f = document.createElement('iframe');
      f.src = tab.getAttribute('href'); f.title = tab.textContent;
      f.allow = 'geolocation'; // "use my location" in the dashboards
      panes.appendChild(f); frames[tab.dataset.tab] = f;
    }
    for (const t of tabs) {
      const on = t === tab, f = frames[t.dataset.tab];
      t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
      if (f) { f.classList.toggle('active', on); f.contentWindow?.postMessage({ type: 'tab', active: on }, location.origin); }
    }
    if (location.hash !== '#' + tab.dataset.tab) history.replaceState(null, '', '#' + tab.dataset.tab);
  }
  for (const t of tabs) t.onclick = e => { e.preventDefault(); show(t.dataset.tab); }; // real links so crawlers find the dashboards
  document.querySelector('nav').addEventListener('keydown', e => { // arrow keys move between tabs
    const i = tabs.indexOf(document.activeElement); if (i < 0 || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; next.focus(); show(next.dataset.tab);
  });
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  // the dashboards keep their shareable state in this page's URL, so the address bar is always the link
  const share = document.getElementById('share');
  share.onclick = () => navigator.clipboard.writeText(location.href).then(() => { share.textContent = 'Link copied'; },
    () => { share.textContent = 'Copy the address bar'; }) // clipboard blocked: the URL is still shareable by hand
    .then(() => setTimeout(() => { share.textContent = 'Copy link'; }, 2000));
  // light/dark toggle: the pick is saved for every page; open dashboards reload to redraw their maps (state is in the URL)
  const theme = document.getElementById('theme'), root = document.documentElement;
  const paintTheme = () => {
    theme.textContent = root.dataset.theme === 'light' ? 'Dark mode' : 'Light mode';
    document.querySelector('meta[name=theme-color]').content = root.dataset.theme === 'light' ? '#F6F4EE' : '#141A22';
  };
  theme.onclick = () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', root.dataset.theme); } catch { /* storage blocked: applies until the page closes */ }
    paintTheme();
    for (const f of Object.values(frames)) f.contentWindow.location.reload();
  };
  paintTheme();
  show(location.hash.slice(1));
</script>
</body>
</html>
